#
# Marlin Firmware
# PlatformIO Configuration File
#

#################################
#                               #
#      SAM3U Architecture       #
#                               #
#################################

#
# 4pi (Atmel AT91SAM3U4E ARM Cortex-M3, 96MHz, 256KB flash, 48KB SRAM)
#
# There is no Arduino core for the SAM3U, so this environment builds
# bare-metal against the CMSIS device headers from PlatformIO's atmelsam
# platform. Marlin/src/HAL/SAM3U/include/Arduino.h supplies the slice of the
# Arduino API that Marlin's shared layer expects.
#
# sam3u_build.py adds the CMSIS include paths, compiles the CMSIS startup
# code (vector table + Reset_Handler) and restores libc/libm/libgcc, since the
# bare-metal builder links with -nostdlib.
#
# The linker script is Marlin's own rather than the stock CMSIS one: it
# reserves the top 4KB of flash for EEPROM emulation and lays SRAM out with
# the heap and stack growing toward each other.
#
# Upload is over SAM-BA. To reach the bootloader, short the RESET pads on top
# of the 4pi and power-cycle it.
#
[env:4pi]
platform             = atmelsam
board                = marlin_4pi
framework            =
platform_packages    = framework-cmsis
                       framework-cmsis-atmel

board_build.ldscript = buildroot/share/PlatformIO/variants/SAM3U/sam3u4e_marlin.ld

build_src_filter     = ${common.default_src_filter} +<src/HAL/SAM3U>

# The bare-metal builder defaults to -std=gnu++11; Marlin wants C++17.
build_unflags        = -std=gnu++11

build_flags          = ${common.build_flags}
                       -D__SAM3U4E__
                       -DARDUINO_ARCH_SAM3U
                       -std=gnu++17

build_src_flags      = -IMarlin/src/HAL/SAM3U/include

extra_scripts        = ${common.extra_scripts}
                       pre:buildroot/share/PlatformIO/scripts/sam3u_build.py

upload_protocol      = sam-ba
