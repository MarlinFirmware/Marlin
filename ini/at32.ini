#
# Marlin Firmware
# PlatformIO Configuration File
#

#################################
#
# AT32F403 Architecture with AT32 HAL
#
# Naming Example: AT32F403ARGT7
#
# |- Artery Technology
# |  |- Product Type (AT)
# |  | |- Family (32: 32-bit MCU)
# |  | | |- Core Type (F: ARM Cortex-M)
# |  | | | |- Architecture (4: Cortex-M4)
# |  | | | | |- Performance (0: Standard Performance)
# |  | | | | | |- Configuration (3: Configuration 1)
# |  | | | | | | |- Pin Count (A: 100)
# |  | | | | | | | |- Flash Capacity (R: 256KB, C: 1MB)
# |  | | | | | | | | |- Package (G: LQFP, T: LQFP, H: VFBGA)
# AT 3 2 F 4 0 3 A R G T 7
#
#################################

#
# Base Environment for AT32F403
#
[AT32F403_base]
platform          = file://buildroot/share/PlatformIO/platform-at32
framework         = arduino
board             = at32f403argt7
build_src_filter  = ${common.default_src_filter} +<src/HAL/AT32>
build_type        = release
build_flags       = -mcpu=cortex-m4              # ARM Cortex-M4 processor
                   -mthumb                       # Thumb-2 instruction set
                   -mfloat-abi=hard              # Hardware floating point
                   -mfpu=fpv4-sp-d16             # FPv4-Sp single-precision
                   -DF_CPU=240000000L            # Force constant F_CPU for constexpr
                   -DARDUINO_ARCH_AT32           # Marlin HAL detection
                   -DARDUINO_ARCH_AT32F4         # Arduino core compat (if needed)
                   -DPLATFORM_M997_SUPPORT       # Enable M997 command

# AT32 app configuration file
board_build.app_config = Marlin/src/HAL/AT32/app_config.h

# Extra build flags
board_build.flags.common = -g3                   # Force emit debug symbols to elf
                          -fno-signed-char       # Force unsigned char

# Additional flags to reduce binary size
board_build.flags.cpp = -fno-threadsafe-statics  # Disable thread-safe statics
                        -fno-exceptions          # Disable exceptions (not used by Marlin)
                        -fno-rtti                # Disable RTTI (not used by Marlin)

#
# Wanhao 0327001 v2.0 (AT32F403ARGT7) - 256K Flash
#
[env:WANHAO_0327001]
extends                     = AT32F403_base
board                       = at32f403argt7
board_build.variant         = marlin_at32f403
extra_scripts               = ${common.extra_scripts}
                              pre:buildroot/share/PlatformIO/scripts/generic_create_variant.py
board_upload.maximum_size   = 262144
board_upload.offset_address = 0xC000            # Bootloader start address

#
# EasyThreed K7 ET4000+ (AT32F403ARCT7) - 1MB Flash
#
[env:EASYTHREED_ET4000_PLUS]
extends                     = AT32F403_base
board                       = at32f403arct7
board_build.variant         = marlin_at32f403
extra_scripts               = ${common.extra_scripts}
                              pre:buildroot/share/PlatformIO/scripts/generic_create_variant.py
board_upload.maximum_size   = 1048576
board_upload.offset_address = 0xC000            # Bootloader start address
