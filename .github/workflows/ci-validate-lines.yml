#
# ci-validate-lines.yml
# Validate that all text files are unchanged by linesformat.py
#

name: CI - Validate Source Files

on:
  pull_request:
    branches:
      - bugfix-2.1.x
      - 2.1.x
  push:
    branches:
      - bugfix-2.1.x
      - 2.1.x

# Cancel PR runs superseded by a new push, so stacked runs don't queue up behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate_source_files:
    name: Validate Source Files
    if: github.repository == 'MarlinFirmware/Marlin'

    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out the PR
        uses: actions/checkout@v7

      - name: Validate text file formatting
        run: |
          make validate-lines -j
