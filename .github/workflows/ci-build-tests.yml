#
# ci-build-tests.yml
# Do test builds to catch compile errors
#

name: CI - Build Tests

on:
  pull_request:
    branches:
    - bugfix-2.1.x
    - 2.1.x
    paths-ignore:
    - config/**
    - data/**
    - docs/**
    - test/**
    - Marlin/tests/**
    - '**/*.md'
  push:
    branches:
    - bugfix-2.1.x
    - 2.1.x
    - release-*
    paths-ignore:
    - config/**
    - data/**
    - docs/**
    - test/**
    - Marlin/tests/**
    - '**/*.md'

# Cancel PR runs superseded by a new push, so stacked runs don't queue up behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test_builds:
    name: Build Test
    if: github.repository == 'MarlinFirmware/Marlin'

    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      CONFIG_BRANCH: ${{ github.base_ref || github.ref_name }}

    strategy:
      fail-fast: true
      matrix:
        test-platform:

        # AT32
        - WANHAO_0327001
        - EASYTHREED_ET4000_PLUS

    steps:

    - name: Check out the PR
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Select Python 3.9
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.9'
        architecture: 'x64'

    - name: Install PlatformIO
      run: |
        pip install -U platformio

    - name: Resolve cache group
      id: cache-group
      env:
        TEST_PLATFORM: ${{ matrix.test-platform }}
      run: |
        # Targets with the same platform and packages share a toolchain, so they share a cache
        pio project config --json-output | python3 -c '
        import hashlib, json, os, sys
        config = dict(json.load(sys.stdin))
        env = dict(config.get("env:" + os.environ["TEST_PLATFORM"], []))
        toolchain = json.dumps([env.get("platform"), env.get("platform_packages")])
        print("name=" + hashlib.sha1(toolchain.encode()).hexdigest()[:12])
        ' >>"$GITHUB_OUTPUT"

    - name: Restore PlatformIO cache
      id: pio-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-pio-v2-${{ steps.cache-group.outputs.name }}

    # Libraries are installed per env, so each target keeps its own cache
    - name: Restore library cache
      id: lib-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .pio/libdeps
        key: ${{ runner.os }}-libdeps-v1-${{ matrix.test-platform }}-${{ hashFiles('ini/*.ini', 'platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-libdeps-v1-${{ matrix.test-platform }}-

    - name: Update PlatformIO packages
      run: |
        pio pkg update --global

    - name: Install Simulator dependencies
      if: matrix.test-platform == 'simulator_linux_release'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsdl2-dev libsdl2-net-dev libglm-dev

    - name: Run ${{ matrix.test-platform }} Tests
      run: |
        make tests-single-ci TEST_TARGET=${{ matrix.test-platform }}

    # Only push builds refresh the caches, so PR runs can't fill the repo cache quota
    - name: Save PlatformIO cache
      if: github.event_name == 'push' && steps.pio-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.platformio
        key: ${{ steps.pio-cache.outputs.cache-primary-key }}

    - name: Save library cache
      if: github.event_name == 'push' && steps.lib-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .pio/libdeps
        key: ${{ steps.lib-cache.outputs.cache-primary-key }}
