#
# Marlin Firmware
# Test: esp32/config-03.ini
#
# BTT Rodent CNC with chained TMC2160, spindle and coolant
#

[config:base]
motherboard                              = BOARD_BTT_RODENT_V1
extruders                                = 0
default_axis_steps_per_unit              = { 800, 800, 800 }
default_max_feedrate                     = { 80, 80, 20 }
default_max_acceleration                 = { 500, 500, 100 }
axis_relative_modes                      = { false, false, false }
temp_sensor_0                            = 0
temp_sensor_bed                          = 0
x_driver_type                            = TMC2160
y_driver_type                            = TMC2160
z_driver_type                            = TMC2160
x_rsense                                 = 0.075
y_rsense                                 = 0.075
z_rsense                                 = 0.075
x_chain_pos                              = 1
y_chain_pos                              = 2
z_chain_pos                              = 3
spindle_feature                          = on
coolant_control                          = on
coolant_mist                             = on
coolant_flood                            = on
