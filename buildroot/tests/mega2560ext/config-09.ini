#
# Marlin Firmware
# Test: mega2560ext/config-09.ini
#
# SCARA without SCARA_CALIBRATION, with an elbow range and no shoulder range | EEPROM
#

[config:base]
ini_use_config                           = example/SCARA/MP_SCARA
y_min_pos                                = -190
scara_psi_min                            = -170
scara_psi_max                            = 170

scara                                    = on
scara_calibration                        = off
motherboard                              = BOARD_RAMPS_14_EFB
eeprom_settings                          = on
