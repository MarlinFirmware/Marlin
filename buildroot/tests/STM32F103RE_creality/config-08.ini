#
# Marlin Firmware
# Test: STM32F103RE_creality/config-08.ini
#
# Creality V4.2.2 with E3V2_TOUCH (no probe)
#

[config:base]
motherboard                              = BOARD_CREALITY_V422
serial_port                              = 1
dgus_lcd_ui                              = E3V2_TOUCH
temp_sensor_bed                          = 1
sdsupport                                = on
babystepping                             = on
babystep_display_total                   = on
fan_soft_pwm                             = on
no_creality_422_driver_warning           = on
no_auto_assign_warning                   = on
