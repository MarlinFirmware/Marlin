#
# Marlin Firmware
# Test: STM32F103RE_creality/config-07.ini
#
# Creality V4.2.7 with E3V2_TOUCH (BLTouch, power-loss recovery, runout sensor)
#

[config:base]
motherboard                              = BOARD_CREALITY_V427
serial_port                              = 1
dgus_lcd_ui                              = E3V2_TOUCH
temp_sensor_bed                          = 1
sdsupport                                = on
eeprom_settings                          = on
bltouch                                  = on
auto_bed_leveling_bilinear               = on
z_safe_homing                            = on
babystepping                             = on
babystep_zprobe_offset                   = on
power_loss_recovery                      = on
filament_runout_sensor                   = on
nozzle_park_feature                      = on
advanced_pause_feature                   = on
fan_soft_pwm                             = on
no_creality_422_driver_warning           = on
no_auto_assign_warning                   = on
