#
# Marlin Firmware
# Test: STM32F103RE_creality/config-07.ini
#
# Creality Sermoon D1 with SERMOON_D1 (BLTouch, runout sensor, power-loss recovery)
#

[config:base]
motherboard                              = BOARD_CREALITY_V431_D
serial_port                              = 1
dgus_lcd_ui                              = SERMOON_D1
temp_sensor_bed                          = 1
sdsupport                                = on
eeprom_settings                          = on
bltouch                                  = on
use_probe_for_z_homing                   = on
z_min_probe_uses_z_min_endstop_pin       = off
auto_bed_leveling_bilinear               = on
grid_max_points_x                        = 5
z_safe_homing                            = on
babystepping                             = on
filament_runout_sensor                   = on
nozzle_park_feature                      = on
advanced_pause_feature                   = on
filament_change_resume_on_insert         = on
power_loss_recovery                      = on
fan_soft_pwm                             = on
no_auto_assign_warning                   = on
