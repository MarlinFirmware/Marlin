#
# Marlin Firmware
# Test: STM32H723VG_btt/config-01.ini
#
# BigTreeTech Scylla V1.0 | CNC | XYZA | TMC2160 | Spindle | Coolant
#

[config:base]
motherboard                              = BOARD_BTT_SCYLLA_V1_0
serial_port                              = -1
extruders                                = 0
temp_sensor_0                            = 0
temp_sensor_bed                          = 0
x_driver_type                            = TMC2160
y_driver_type                            = TMC2160
z_driver_type                            = TMC2160
i_driver_type                            = TMC2160
x_rsense                                 = 0.05
y_rsense                                 = 0.05
z_rsense                                 = 0.05
i_rsense                                 = 0.05
default_axis_steps_per_unit              = { 80, 80, 400, 80 }
default_max_feedrate                     = { 300, 300, 5, 300 }
default_max_acceleration                 = { 3000, 3000, 100, 3000 }
manual_feedrate                          = { 50*60, 50*60, 4*60, 50*60 }
axis_relative_modes                      = { false, false, false, false }
homing_feedrate_mm_m                     = { (50*60), (50*60), (4*60), (50*60) }
homing_bump_mm                           = { 5, 5, 2, 5 }
homing_bump_divisor                      = { 2, 2, 4, 2 }
axis4_rotates                            = on
i_min_pos                                = on
i_max_pos                                = on
i_home_dir                               = on
i_enable_on                              = on
invert_i_dir                             = false
eeprom_settings                          = on
sdsupport                                = on
spindle_feature                          = on
spindle_change_dir                       = on
coolant_control                          = on
neopixel_led                             = on
tmc_debug                                = on
