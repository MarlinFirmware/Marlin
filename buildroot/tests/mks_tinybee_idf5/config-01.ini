#
# Marlin Firmware
# Test: mks_tinybee_idf5/config-01.ini
#
# MKS TinyBee on arduino-esp32 3.x with ESP3D_WIFISUPPORT, WEBSUPPORT, OTASUPPORT and SD
#

[config:base]
motherboard                              = BOARD_MKS_TINYBEE
serial_port_2                            = -1
baudrate_2                               = 250000
esp3d_wifisupport                        = on
websupport                               = on
otasupport                               = on
wifi_custom_command                      = on
sdsupport                                = on
