#
# Marlin Firmware
# Test: EasyThreed K7 Rev. B ET4000+ with AT32F407
#
# Native AT32 build fixture with external 24C16 EEPROM.
# The target printer has no heated bed.
#

[config:base]
motherboard                              = BOARD_EASYTHREED_K7_REVB_AT32F407
serial_port                              = 1
serial_port_2                            = 2
baudrate                                 = 115200
temp_sensor_0                            = 1
temp_sensor_bed                          = 0
eeprom_settings                          = on
sdsupport                                = on
emergency_parser                         = on
pins_debugging                           = on
easythreed_ui                            = on
