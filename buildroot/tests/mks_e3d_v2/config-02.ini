#
# Marlin Firmware
# Test: mks_e3d_v2/config-02.ini
#
# Elegoo Neptune 3 Pro with its TJC touch screen
#

[config:base]
motherboard                              = BOARD_MKS_E3D_V2
serial_port                              = 1
baudrate                                 = 115200
elegoo_neptune_3_tft                     = on
fix_mounted_probe                        = on
z_min_probe_uses_z_min_endstop_pin       = off
use_probe_for_z_homing                   = on
auto_bed_leveling_bilinear               = on
grid_max_points_x                        = 6
preheat_before_leveling                  = on
z_safe_homing                            = on
eeprom_settings                          = on
sdsupport                                = on
babystepping                             = on
babystep_zprobe_offset                   = on
case_light_enable                        = on
filament_runout_sensor                   = on
advanced_pause_feature                   = on
nozzle_park_feature                      = on
power_loss_recovery                      = on
no_auto_assign_warning                   = on
