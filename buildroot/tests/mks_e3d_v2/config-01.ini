#
# Marlin Firmware
# Test: mks_e3d_v2/config-01.ini
#
# Elegoo Neptune 3 Pro with probe, runout sensor and top light
#

[config:base]
motherboard                              = BOARD_MKS_E3D_V2
serial_port                              = 1
baudrate                                 = 115200
e0_auto_fan_pin                          = PB0
fix_mounted_probe                        = on
z_min_probe_uses_z_min_endstop_pin       = off
auto_bed_leveling_bilinear               = on
z_safe_homing                            = on
eeprom_settings                          = on
sdsupport                                = on
case_light_enable                        = on
filament_runout_sensor                   = on
advanced_pause_feature                   = on
nozzle_park_feature                      = on
emergency_parser                         = on
