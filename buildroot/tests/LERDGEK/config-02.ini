#
# Marlin Firmware
# Test: LERDGEK/config-02.ini
#
# TFT Color UI with touch screen and UBL mesh editing
#

[config:base]
motherboard                              = BOARD_LERDGE_K
serial_port                              = 1
tft_generic                              = on
tft_interface_fsmc                       = on
tft_color_ui                             = on
touch_screen                             = on
eeprom_settings                          = on
fix_mounted_probe                        = on
z_safe_homing                            = on
auto_bed_leveling_ubl                    = on
lcd_bed_leveling                         = on
