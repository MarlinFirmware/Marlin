#
# Marlin Firmware
# Test: LPC1768/config-06.ini
#
# MKS SBASE with Mixing Extruder, Gradient Mix, FT Motion
#

[config:base]
motherboard                              = BOARD_MKS_SBASE
mixing_steppers                          = 2
mixing_extruder                          = on
direct_mixing_in_g1                      = on
gradient_mix                             = on
gradient_vtool                           = on
disable_other_extruders                  = off
ultimakercontroller                      = on
ft_motion                                = on
ft_motion_menu                           = on
