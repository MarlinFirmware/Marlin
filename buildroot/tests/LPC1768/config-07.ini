#
# Marlin Firmware
# Test: LPC1768/config-07.ini
#
# MKS SBASE with SD sorting using RAM without name caching.
#

[config:base]
motherboard                              = BOARD_MKS_SBASE
reprap_discount_smart_controller         = on
sdsupport                                = on
sdcard_sort_alpha                        = on
sdsort_uses_ram                          = true
