#
# Marlin Firmware
# Test: STM32F401RC_creality/config-02.ini
#
# Creality Sermoon V1 with SERMOON_V1 (manual mesh, runout sensor, power-loss recovery)
#

[config:base]
motherboard                              = BOARD_CREALITY_V24S1_200
serial_port                              = 1
dgus_lcd_ui                              = SERMOON_V1
temp_sensor_bed                          = 1
x_home_dir                               = 1
z_home_dir                               = 1
sdsupport                                = on
eeprom_settings                          = on
probe_manually                           = on
mesh_bed_leveling                        = on
filament_runout_sensor                   = on
nozzle_park_feature                      = on
advanced_pause_feature                   = on
power_loss_recovery                      = on
case_light_enable                        = on
fan_soft_pwm                             = on
no_auto_assign_warning                   = on
