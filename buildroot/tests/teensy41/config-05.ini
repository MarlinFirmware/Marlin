#
# Marlin Firmware
# Test: teensy41/config-05.ini
#
# Mixing Extruder | V-tools and Gradient in EEPROM
#

[config:base]
motherboard                              = BOARD_TEENSY41
mixing_steppers                          = 2
mixing_extruder                          = on
direct_mixing_in_g1                      = on
gradient_mix                             = on
gradient_vtool                           = on
eeprom_settings                          = on
mixing_vtools_in_eeprom                  = on
gradient_mix_in_eeprom                   = on
disable_other_extruders                  = off
