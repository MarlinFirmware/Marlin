#
# Creality CR-6 SE with BTT SKR CR6 and the stock touch screen
#

[config:base]
ini_use_config                           = example/Creality/CR-6 SE/BigTreeTech SKR CR6 with BTT TFT
cr10_stockdisplay                        = off
serial_port_2                            = off
dgus_lcd_ui                              = CREALITY_TOUCH
eeprom_autosave_after                    = 5000
fwretract                                = on
filament_load_unload_gcodes              = on
set_progress_manually                    = on
show_remaining_time                      = on
