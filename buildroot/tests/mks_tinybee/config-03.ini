#
# Marlin Firmware
# Test: mks_tinybee/config-03.ini
#
# MKS TinyBee with Bluetooth as SERIAL_PORT_2 (-2)
# and Input Shaping and Babystepping over the I2S stream
#

[config:base]
motherboard                              = BOARD_MKS_TINYBEE
serial_port_2                            = -2
input_shaping_x                          = on
input_shaping_y                          = on
babystepping                             = on
