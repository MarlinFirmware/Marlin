#
# Marlin Firmware
# Test: mks_tinybee/config-04.ini
#
# MKS TinyBee with a 3-wire MAX31865 bed sensor sharing the SD card's SPI bus
#

[config:base]
motherboard                              = BOARD_MKS_TINYBEE
temp_sensor_bed                          = -5
temp_bed_cs_pin                          = 14
max31865_sensor_wires_bed                = 3
sdsupport                                = on
