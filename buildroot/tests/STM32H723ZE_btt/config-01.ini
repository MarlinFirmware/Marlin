#
# Marlin Firmware
# Test: STM32H723ZE_btt/config-01.ini
#
# BigTreeTech OCTOPUS MAX EZ V1_0 | BED_ZONES
#

[config:base]
motherboard                              = BOARD_BTT_OCTOPUS_MAX_EZ_V1_0
serial_port                              = -1
bed_zones                                = on
bed_zone_heater_pins                     = {HEATER_BED_PIN,HEATER_1_PIN,HEATER_2_PIN,HEATER_3_PIN}
bed_zone_sensor_pins                     = {TEMP_BED_PIN,TEMP_1_PIN,TEMP_2_PIN,TEMP_3_PIN}
bed_zone_masks                           = {0b1111100110011111, 0b0000011001100000}
