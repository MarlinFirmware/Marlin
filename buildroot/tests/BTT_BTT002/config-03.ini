#
# Marlin Firmware
# Test: BTT_BTT002/config-03.ini
#
# BigTreeTech BTT002 with TMC2240 sensorless homing (StallGuard4), SPI endstops,
# and a homing Hybrid Threshold with LCD menu and EEPROM
#

[config:base]
motherboard                              = BOARD_BTT_BTT002_V1_0
serial_port                              = 1
x_driver_type                            = TMC2240
y_driver_type                            = TMC2240
z_driver_type                            = TMC2240
x_current_home                           = (X_CURRENT - 100)
y_current_home                           = (Y_CURRENT - 100)
sensorless_homing                        = on
x_stall_sensitivity                      = 60
y_stall_sensitivity                      = 60
spi_endstops                             = on
hybrid_threshold                         = on
homing_hybrid_threshold                  = on
tmc_debug                                = on
monitor_driver_status                    = on
eeprom_settings                          = on
reprap_discount_full_graphic_smart_controller = on
