#
# Marlin Firmware
# Test: STM32F427ZI_prusa_xbuddy/config-01.ini
#
# Basic build test for Prusa xBuddy Board (STM32F427ZIT6, Mk4 / Core One)
# TMC2209 UART drivers, sensorless homing
#

[config:base]
motherboard                              = BOARD_PRUSA_XBUDDY

x_driver_type                            = TMC2209
y_driver_type                            = TMC2209
z_driver_type                            = TMC2209
e0_driver_type                           = TMC2209

sensorless_homing                        = on
x_stall_sensitivity                      = 60
y_stall_sensitivity                      = 60
z_stall_sensitivity                      = 60
