#
# Marlin Firmware
# Test: GD32F303RG_kobra2_neo_mfl/config-01.ini
#
# Anycubic Kobra 2 Neo / TriGorilla Gen V4.0.1 GD32 Default Configuration
#

[config:base]
motherboard                              = BOARD_TRIGORILLA_V401_GD32_MFL
serial_port                              = 1
tft_generic                              = on
tft_interface_spi                        = on
tft_driver                               = ST7789
tft_res_320x240                          = on
tft_color_ui                             = on
eeprom_settings                          = on
sdsupport                                = on
emergency_parser                         = on
fan_soft_pwm                             = on
pins_debugging                           = on
no_auto_assign_warning                   = on
