#
# Marlin Firmware
# Test: PRUSA_BUDDY/config-01.ini
#
# Prusa MINI on the Prusa Buddy board. Machine settings follow the
# Prusa-Firmware-Buddy v4.4.1 MINI configuration: TMC2209 UART drivers,
# sensorless XY homing, MINDA probe, Prusa MINI LCD with ColorUI, filament
# sensor, and USB Flash Drive media.
#

[config:base]
motherboard                              = BOARD_PRUSA_BUDDY
serial_port                              = -1
custom_machine_name                      = "Prusa MINI"
eeprom_settings                          = on
eeprom_auto_init                         = on
speaker                                  = on

# Thermal
temp_sensor_0                            = 5
temp_sensor_bed                          = 1
temp_sensor_board                        = 1000
board_beta                               = 4550
board_mintemp                            = 5
board_maxtemp                            = 120
heater_0_maxtemp                         = 305
bed_maxtemp                              = 110
default_kp                               = 7.00
default_ki                               = 0.50
default_kd                               = 45.00
pidtempbed                               = on
default_bed_kp                           = 120.00
default_bed_ki                           = 1.50
default_bed_kd                           = 600.00
pid_edit_menu                            = on
pid_autotune_menu                        = on
extrude_maxlength                        = 1000
thermal_protection_period                = 20
thermal_protection_hysteresis            = 6
watch_temp_period                        = 20
thermal_protection_bed_period            = 45
thermal_protection_bed_hysteresis        = 25
watch_bed_temp_period                    = 240
thermal_protection_variance_monitor      = on
hotend_idle_timeout                      = on
e0_auto_fan_pin                          = FAN1_PIN

# Filament presets
preheat_1_label                          = "PLA"
preheat_1_temp_hotend                    = 215
preheat_1_temp_bed                       = 60
preheat_2_label                          = "PETG"
preheat_2_temp_hotend                    = 230
preheat_2_temp_bed                       = 85
preheat_3_label                          = "ASA"
preheat_3_temp_hotend                    = 260
preheat_3_temp_bed                       = 100
preheat_3_temp_chamber                   = 35
preheat_3_fan_speed                      = 0
preheat_4_label                          = "PC"
preheat_4_temp_hotend                    = 275
preheat_4_temp_bed                       = 100
preheat_4_temp_chamber                   = 35
preheat_4_fan_speed                      = 0
preheat_5_label                          = "PVB"
preheat_5_temp_hotend                    = 215
preheat_5_temp_bed                       = 75
preheat_5_temp_chamber                   = 35
preheat_5_fan_speed                      = 0
preheat_6_label                          = "ABS"
preheat_6_temp_hotend                    = 255
preheat_6_temp_bed                       = 100
preheat_6_temp_chamber                   = 35
preheat_6_fan_speed                      = 0
preheat_7_label                          = "HIPS"
preheat_7_temp_hotend                    = 220
preheat_7_temp_bed                       = 100
preheat_7_temp_chamber                   = 35
preheat_7_fan_speed                      = 0
preheat_8_label                          = "PP"
preheat_8_temp_hotend                    = 240
preheat_8_temp_bed                       = 100
preheat_8_temp_chamber                   = 35
preheat_8_fan_speed                      = 0
preheat_9_label                          = "FLEX"
preheat_9_temp_hotend                    = 240
preheat_9_temp_bed                       = 50
preheat_9_temp_chamber                   = 35
preheat_9_fan_speed                      = 0

# Motion
x_driver_type                            = TMC2209
y_driver_type                            = TMC2209
z_driver_type                            = TMC2209
e0_driver_type                           = TMC2209
endstop_interrupts_feature               = on
default_axis_steps_per_unit              = { 100, 100, 400, 325 }
default_max_feedrate                     = { 180, 180, 12, 80 }
default_max_acceleration                 = { 1250, 1250, 400, 4000 }
default_acceleration                     = 1250
default_retract_acceleration             = 1250
default_travel_acceleration              = 1250
invert_x_dir                             = false
invert_y_dir                             = false
invert_z_dir                             = true
invert_e0_dir                            = true
home_after_deactivate                    = on
x_home_dir                               = 1
y_home_dir                               = -1
z_home_dir                               = -1
x_bed_size                               = 180
y_bed_size                               = 180
x_min_pos                                = -2
y_min_pos                                = -3
z_max_pos                                = 185
manual_x_home_pos                        = 180.4
homing_bump_mm                           = { 0, 0, 2 }
homing_feedrate_mm_m                     = { 3000, 3000, (6*60) }
z_clearance_for_homing                   = 4
z_safe_homing                            = on
z_safe_homing_x_point                    = 147.4
z_safe_homing_y_point                    = 21.1
individual_axis_homing_menu              = on
manual_feedrate                          = { 50*60, 50*60, 6*60, 3*60 }
input_shaping_x                          = on
input_shaping_y                          = on
shaping_freq_x                           = 118.2
shaping_freq_y                           = 32.8
shaping_menu                             = on
adaptive_step_smoothing                  = on
lin_advance                              = on
advance_k                                = 0
babystepping                             = on
babystep_without_homing                  = on
babystep_always_available                = on
doubleclick_for_z_babystepping           = on
babystep_display_total                   = on
babystep_zprobe_offset                   = on

# TMC2209
x_current                                = 350
y_current                                = 350
z_current                                = 350
e0_current                               = 400
z_microsteps                             = 8
x_rsense                                 = 0.22
y_rsense                                 = 0.22
z_rsense                                 = 0.22
e0_rsense                                = 0.22
chopper_timing                           = CHOPPER_PRUSAMK3_24V
monitor_driver_status                    = on
hybrid_threshold                         = on
sensorless_homing                        = on
x_stall_sensitivity                      = 8
y_stall_sensitivity                      = 8
no_homing_current_warning                = on

# MINDA probe and bed leveling
fix_mounted_probe                        = on
nozzle_to_probe_offset                   = { -29, -3, 0 }
probing_margin                           = 5
xy_probe_feedrate                        = 5000
z_probe_feedrate_fast                    = (6*60)
z_probe_feedrate_slow                    = (Z_PROBE_FEEDRATE_FAST / 3)
multiple_probing                         = 2
z_clearance_deploy_probe                 = 0
z_clearance_between_probes               = 1
z_clearance_multi_probe                  = 0.5
z_after_probing                          = 2
z_min_probe_repeatability_test           = on
probe_offset_wizard                      = on
auto_bed_leveling_bilinear               = on
preheat_before_leveling                  = on
g26_mesh_validation                      = on
grid_max_points_x                        = 4
extrapolate_beyond_grid                  = on

# Filament sensor and filament change
filament_runout_sensor                   = on
advanced_pause_feature                   = on
nozzle_park_feature                      = on
nozzle_park_point                        = { (X_MAX_POS - 10), (Y_MAX_POS - 10), 20 }
pause_park_retract_feedrate              = 66
filament_change_unload_feedrate          = 80
filament_change_unload_accel             = 1250
filament_change_unload_length            = 420
filament_change_slow_load_feedrate       = 10
filament_change_slow_load_length         = 40
filament_change_fast_load_feedrate       = 80
filament_change_fast_load_accel          = 625
filament_change_fast_load_length         = 320
advanced_pause_fans_pause                = on
filament_unload_purge_retract            = 30
filament_unload_purge_length             = 16
filament_unload_purge_feedrate           = 66
park_head_on_pause                       = on
home_before_filament_change              = on
filament_load_unload_gcodes              = on

# Media
sdsupport                                = on
usb_flash_drive_support                  = on
use_otg_usb_host                         = on
sdcard_sort_alpha                        = on
long_filename_host_support               = on
scroll_long_filenames                    = on
power_loss_recovery                      = on
gcode_repeat_markers                     = on
printcounter                             = on

# Display
prusa_mini_lcd                           = on
tft_color_ui                             = on
reinit_noisy_lcd                         = off
lcd_info_menu                            = on
preheat_shortcut_menu_item               = on
sound_menu_item                          = on
status_message_scrolling                 = on
set_progress_manually                    = on
set_interaction_time                     = on
show_remaining_time                      = on

# Host
emergency_parser                         = on
bufsize                                  = 16
auto_report_fans                         = on
report_fan_change                        = on
auto_report_position                     = on
m115_geometry_report                     = on
gcode_macros                             = on
cancel_objects                           = on
