#
# Marlin Firmware
# Test: mks_robin_nano_v3/config-01.ini
#
# MKS Robin Nano V3 with MKS TS35 and the Galaxy UI
#

[config:base]
motherboard                              = BOARD_MKS_ROBIN_NANO_V3
serial_port                              = -1
mks_ts35_v2_0                            = on
tft_color_ui                             = on
novin3dp_galaxy_ui                       = on
galaxy_touch_beep                        = on
touch_screen_calibration                 = on
sdsupport                                = on
eeprom_settings                          = on
