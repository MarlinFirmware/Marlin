#
# Marlin Firmware
# Test: MKS_OWL/config-03.ini
#
# MKS OWL | OTG USB Flash Drive (the board's only onboard media) | Emergency Parser
#

[config:base]
motherboard                              = BOARD_MKS_OWL
serial_port                              = -1
sdsupport                                = on
usb_flash_drive_support                  = on
use_otg_usb_host                         = on
emergency_parser                         = on
