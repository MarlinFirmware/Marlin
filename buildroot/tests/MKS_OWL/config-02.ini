#
# Marlin Firmware
# Test: MKS_OWL/config-02.ini
#
# MKS OWL | RRD Full Graphic LCD | I2C EEPROM | BLTouch + ABL | TMC2209 UART
#

[config:base]
motherboard                              = BOARD_MKS_OWL
serial_port                              = -1
x_driver_type                            = TMC2209
y_driver_type                            = TMC2209
z_driver_type                            = TMC2209
e0_driver_type                           = TMC2209
reprap_discount_full_graphic_smart_controller = on
sdsupport                                = on
eeprom_settings                          = on
bltouch                                  = on
z_safe_homing                            = on
auto_bed_leveling_bilinear               = on
