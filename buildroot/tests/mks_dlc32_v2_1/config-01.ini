#
# Marlin Firmware
# Test: mks_dlc32_v2_1/config-01.ini
#
# MKS DLC32 V2.1 with MKS TS24-R V2.1 touch screen
#

[config:base]
motherboard                              = BOARD_MKS_DLC32_V2_1
extruders                                = 0
temp_sensor_0                            = 0
temp_sensor_bed                          = 0
axis_relative_modes                      = { false, false, false }
default_axis_steps_per_unit              = { 80, 80, 400 }
default_max_feedrate                     = { 300, 300, 5 }
default_max_acceleration                 = { 3000, 3000, 100 }
manual_feedrate                          = { 50*60, 50*60, 4*60 }
mks_ts24_r_v2_1                          = on
tft_color_ui                             = on
touch_screen                             = on
