#
# Marlin Firmware
# Test: mega2560/config-12.ini
#
# RAMPS 1.4 | EXTRUDERS 4 | 3D Chameleon Mk4 | Advanced Pause ...
#

[config:base]
motherboard                              = BOARD_RAMPS_14_EFB
extruders                                = 4
mmu_model                                = CHAMELEON
temp_sensor_1                            = 1
temp_sensor_bed                          = 1
reprap_discount_smart_controller         = on
sdsupport                                = on
eeprom_settings                          = on
nozzle_park_feature                      = on
advanced_pause_feature                   = on
filament_runout_sensor                   = on
