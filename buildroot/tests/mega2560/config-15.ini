#
# Marlin Firmware
# Test: mega2560/config-15.ini
#
# RAMPS | No heated bed | Fixed probe | ABL Bilinear | PREHEAT_BEFORE_LEVELING
#

[config:base]
motherboard                              = BOARD_RAMPS_14_EFF
temp_sensor_bed                          = 0
fix_mounted_probe                        = on
auto_bed_leveling_bilinear               = on
z_safe_homing                            = on
preheat_before_leveling                  = on
leveling_heat_soak_time                  = 60  # No heated bed: the soak is ignored
temp_settle_band                         = 2
