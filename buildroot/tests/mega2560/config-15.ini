#
# Marlin Firmware
# Test: mega2560/config-15.ini
#
# RAMPS 1.4 | ADS1115 thermistors on E0, E1 and the bed | Pull-up voltage on a spare input | ALERT/RDY on AUX1
#

[config:base]
motherboard                              = BOARD_RAMPS_14_EEB
extruders                                = 2
temp_sensor_1                            = 1
ads1115_thermistors                      = on
ads1115_channel_1                        = 1
ads1115_channel_bed                      = 2
ads1115_vref_channel                     = 3
ads1115_rdy_pin                          = 57
