#
# Marlin Firmware
# Test: mega2560/config-11.ini
#
# MEGACONTROLLER | PanelDUE | M100 | PWM_MOTOR_CURRENT | PRINTCOUNTER | Advanced Pause ...
#

[config:base]
motherboard                              = BOARD_MEGACONTROLLER
lcd_language                             = de
controllerfan_speed_idle                 = 128
i2c_slave_address                        = 63
pwm_motor_current                        = { 1300, 1300, 1250 }
eeprom_settings                          = on
eeprom_chitchat                          = on
paneldue                                 = on
sdsupport                                = on
pca9632                                  = on
sound_menu_item                          = on
auto_bed_leveling_bilinear               = on
probe_manually                           = on
g26_mesh_validation                      = on
mesh_edit_menu                           = on
lin_advance                              = on
advance_k_extra                          = on
inch_mode_support                        = on
temperature_units_support                = on
experimental_i2cbus                      = on
m100_free_memory_watcher                 = on
nozzle_park_feature                      = on
nozzle_clean_feature                     = on
advanced_pause_feature                   = on
park_head_on_pause                       = on
advanced_pause_continuous_purge          = on
filament_load_unload_gcodes              = on
printcounter                             = on
service_name_1                           = on
service_interval_1                       = on
m114_detail                              = on
fan_soft_pwm                             = on
use_controller_fan                       = on
controller_fan_editable                  = on
m100_free_memory_dumper                  = on
m100_free_memory_corruptor               = on
