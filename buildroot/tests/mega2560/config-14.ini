#
# Marlin Firmware
# Test: mega2560/config-14.ini
#
# SWITCHING_TOOLHEAD (servo) with the docks at the rear (high Y)
#

[config:base]
motherboard                              = BOARD_RAMPS_14_EEB
extruders                                = 2
temp_sensor_1                            = 1
switching_toolhead                       = on
servo_delay                              = { 300, 300, 300 }
y_max_pos                                = 260
switching_toolhead_y_pos                 = 245
switching_toolhead_y_clear               = 40
switching_toolhead_x_pos                 = { 40, 160 }
