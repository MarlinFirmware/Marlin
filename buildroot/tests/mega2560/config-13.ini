#
# Marlin Firmware
# Test: mega2560/config-13.ini
#
# MAGNETIC_SWITCHING_TOOLHEAD with the docks at the front (low Y)
#

[config:base]
motherboard                              = BOARD_RAMPS_14_EEB
extruders                                = 2
temp_sensor_1                            = 1
magnetic_switching_toolhead              = on
y_min_pos                                = -60
switching_toolhead_y_pos                 = -45
switching_toolhead_y_clear               = 40
switching_toolhead_x_pos                 = { 20, 160 }
switching_toolhead_x_security            = { 40, 140 }
