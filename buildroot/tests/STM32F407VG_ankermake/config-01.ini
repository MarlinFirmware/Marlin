#
# Marlin Firmware
# Test: STM32F407VG_ankermake/config-01.ini
#
# AnkerMake M5 V8111 with TMC2209 UART, sensorless homing, dual Z, nozzle probe and ABL
#

[config:base]
motherboard                              = BOARD_ANKERMAKE_V8111
serial_port                              = 1
serial_port_2                            = 3
baudrate                                 = 1000000
x_driver_type                            = TMC2209
y_driver_type                            = TMC2209
z_driver_type                            = TMC2209
z2_driver_type                           = TMC2209
e0_driver_type                           = TMC2209
sensorless_homing                        = on
y_home_dir                               = 1
temp_sensor_0                            = 5
nozzle_as_probe                          = on
nozzle_to_probe_offset                   = { 0, 0, 0 }
auto_bed_leveling_bilinear               = on
z_safe_homing                            = on
eeprom_settings                          = on
