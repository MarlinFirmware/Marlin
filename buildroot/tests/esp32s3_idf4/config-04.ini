#
# Marlin Firmware
# Test: esp32s3_idf4/config-04.ini
#
# Generic ESP32-S3 with UART, native USB and WiFi serial ports and the emergency parser
#

[config:base]
motherboard                              = BOARD_ESPRESSIF_ESP32S3
emergency_parser                         = on
tx_buffer_size                           = 64
serial_port_2                            = -1
serial_port_3                            = -3
wifi_ssid                                = "ssid"
wifi_pwd                                 = "password"
wifisupport                              = on
websupport                               = on
otasupport                               = on
