#
# Marlin Firmware
# Test: simulator_linux_release/config-02.ini
#
# Simulator | FYSETC Mini 12864 2.1 (ST7565-family, U8glib hardware SPI) with NeoPixel backlight
#

[config:base]
ini_use_config                           = example/Simulator
reprap_discount_full_graphic_smart_controller = off
fysetc_mini_12864_2_1                    = on
neopixel_led                             = on
neopixel_type                            = NEO_RGB
neopixel_pixels                          = 3
led_control_menu                         = on
led_color_presets                        = on
led_user_preset_startup                  = on
