#
# Marlin Firmware
# Test: HC32F460E_kobra_neo/config-01.ini
#
# Anycubic Kobra Neo - Default Configuration
# Board: TRIGORILLA_V306 (HC32F460ECTA, 64-pin)
#

[config:base]
motherboard                              = BOARD_TRIGORILLA_V306
serial_port                              = 1
eeprom_settings                          = on
sdsupport                                = on
emergency_parser                         = on
x_driver_type                            = TMC2209
y_driver_type                            = TMC2209
z_driver_type                            = TMC2209
e0_driver_type                           = TMC2209
extruders                                = 1
temp_sensor_0                            = 1
temp_sensor_bed                          = 1
heater_0_maxtemp                         = 275
bed_maxtemp                              = 120
x_bed_size                               = 400
y_bed_size                               = 400
z_max_pos                                = 450
homing_speed                             = 50
nozzle_as_probe                          = on
probe_tare                               = on
nozzle_to_probe_offset                   = { 0, 0, 0 }
auto_bed_leveling_bilinear               = on
babystepping                             = on
z_safe_homing                            = on
anycubic_lcd_kobra                       = on
