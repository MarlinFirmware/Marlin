#
# Marlin Firmware
# Test: STM32F401RE_creality/config-03.ini
#
# Ender-5 S1 with the stock touch screen (CREALITY_RTS) and no PID heating:
# MPCTEMP for the hotend, bang-bang for the bed. The screen's PID fields read 0.
#

[config:base]
ini_use_config                           = example/Creality/Ender-5 S1/Touch Screen

pidtemp                                  = off
mpctemp                                  = on
pidtempbed                               = off
