#
# Marlin Firmware
# Test: STM32H723VG_fysetc/config-01.ini
#
# FYSETC Spider V3 H7 | Quad Z | TMC2209 | BLTouch | Mini 12864 2.1 | NeoPixel
#

[config:base]
motherboard                              = BOARD_FYSETC_SPIDER_V3_H723
serial_port                              = -1
serial_port_2                            = 1
baudrate                                 = 115200
extruders                                = 2
temp_sensor_1                            = 1
temp_sensor_bed                          = 1
x_driver_type                            = TMC2209
y_driver_type                            = TMC2209
z_driver_type                            = TMC2209
z2_driver_type                           = TMC2209
z3_driver_type                           = TMC2209
z4_driver_type                           = TMC2209
e0_driver_type                           = TMC2209
e1_driver_type                           = TMC2209
default_axis_steps_per_unit              = { 80, 80, 400, 500 }
bltouch                                  = on
z_safe_homing                            = on
auto_bed_leveling_bilinear               = on
fysetc_mini_12864_2_1                    = on
sdsupport                                = on
eeprom_settings                          = on
fan_soft_pwm                             = on
