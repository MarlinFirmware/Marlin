#
# Test configuration: Bilinear leveling with a variable number of grid points
#
[config:base]
ini_use_config             = base

# Unit tests must use BOARD_SIMULATED to run natively in Linux
motherboard                = BOARD_SIMULATED

auto_bed_leveling_bilinear = on
probe_manually             = on
variable_grid_points       = on
grid_max_points_x          = 5
